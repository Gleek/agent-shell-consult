name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.2", "31.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: d12frosted/setup-emacs@v1
        with:
          version: ${{ matrix.emacs }}
      - name: Install dependencies and run ERT
        run: >-
          emacs -Q --batch -L . -l tests/setup.el
          -l tests/agent-shell-consult-test.el
          -f ert-run-tests-batch-and-exit
